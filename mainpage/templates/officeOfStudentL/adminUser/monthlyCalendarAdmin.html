{% extends base_template|default:"adminmain.html" %}{% load static %}
<!-- prettier-ignore -->
{% block bodycontent %}

<!-- SweetAlert2 and jQuery -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- FullCalendar -->
<script src="{% static 'styles/studentlife/fullcalendar/lib/main.min.js' %}"></script>
<link
  rel="stylesheet"
  href="{% static 'styles/studentlife/fullcalendar/lib/main.min.css' %}"
/>
<link rel="stylesheet" href="{% static 'styles/calendarOfEvents.css' %}" />
<!-- Bootstrap 5 CSS and JS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
  ol,
  ul {
    padding-left: 0;
  }
  .fc .fc-daygrid-day-number {
    text-decoration: none !important;
    border-bottom: none !important;
  }
  .fc .fc-col-header-cell-cushion {
    text-decoration: none !important;
    border-bottom: none !important;
  }
</style>
<div class="container">
  <div class="sub-title">
    <h3>OFFICE OF STUDENT LIFE {% if is_admin %} (Admin) {% endif %}</h3>
    <p class="hometext">Home</p>
    <p class="certxt">> Monthly Calendar of Activities</p>
  </div>

  <!-- Calendar Container -->
  <div class="container py-3" id="page-container">
    <div class="row">
      <div class="col-md-9">
        <div id="calendar"></div>
      </div>
    </div>
  </div>
</div>

<!-- Backend JSON data -->
<script>
  var scheds = JSON.parse("{{ sched_json|escapejs }}");
</script>

<!-- FullCalendar Init -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var calendarEl = document.getElementById("calendar");

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: "dayGridMonth",
      selectable: true,
      selectHelper: true,
      events: Object.values(scheds),
      eventClick: function (info) {
        // Fill modal fields
        document.getElementById("title").textContent = info.event.title;
        document.getElementById("description").textContent =
          info.event.extendedProps.description || "";
        document.getElementById("start").textContent =
          info.event.start.toLocaleString();
        document.getElementById("end").textContent = info.event.end
          ? info.event.end.toLocaleString()
          : "";

        // Set data-id for edit/delete
        document.getElementById("edit") &&
          (document.getElementById("edit").dataset.id = info.event.id);
        document.getElementById("delete") &&
          (document.getElementById("delete").dataset.id = info.event.id);

        // Show modal
        $("#event-details-modal").modal("show");
      },
          {% if is_admin %}
      select: function (info) {

        const endDate = new Date(info.end);
        endDate.setDate(endDate.getDate() - 1);
        const formattedEnd = endDate.toISOString().slice(0, 16);
        const formattedStart = info.startStr + "T08:00";

        Swal.fire({
          title: "Add Schedule",
          html:
            `<input id="swal-title" class="swal2-input" placeholder="Title">` +
            `<textarea id="swal-description" class="swal2-textarea" placeholder="Description"></textarea>` +
            `<input id="swal-start" type="datetime-local" class="swal2-input" value="${formattedStart}">` +
            `<input id="swal-end" type="datetime-local" class="swal2-input" value="${formattedEnd}">`,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "Save",
          preConfirm: () => {
            const title = document.getElementById("swal-title").value;
            const description =
              document.getElementById("swal-description").value;
            const start_datetime = document.getElementById("swal-start").value;
            const end_datetime = document.getElementById("swal-end").value;

            if (!title || !description || !start_datetime || !end_datetime) {
              Swal.showValidationMessage("All fields are required.");
              return false;
            }

            return { title, description, start_datetime, end_datetime };
          },
        }).then(async (result) => {
          if (result.isConfirmed) {
            try {
              const response = await fetch("{% url 'save_schedule' %}", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRFToken": "{{ csrf_token }}",
                },
                body: JSON.stringify(result.value),
              });

              const responseData = await response.json();

              if (response.ok && responseData.status === "success") {
                Swal.fire("Saved!", "Schedule has been added.", "success");
                calendar.addEvent({
                  id: responseData.id,
                  title: responseData.title,
                  start: responseData.start,
                  end: responseData.end,
                });
              } else {
                throw new Error(
                  responseData.message || "Failed to save schedule."
                );
              }
            } catch (error) {
              Swal.fire("Error", error.message, "error");
            }
          }
        });
      },
          {% endif %}
    });

    calendar.render();
  });
</script>

<!-- Optional: Modal for Viewing Events -->
<div
  class="modal fade"
  tabindex="-1"
  data-bs-backdrop="static"
  id="event-details-modal"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-0">
      <div class="modal-header rounded-0">
        <h5 class="modal-title">Schedule Details</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body rounded-0">
        <div class="container-fluid">
          <dl>
            <dt class="text-muted">Title</dt>
            <dd id="title" class="fw-bold fs-4"></dd>
            <dt class="text-muted">Description</dt>
            <dd id="description" class=""></dd>
            <dt class="text-muted">Start</dt>
            <dd id="start" class=""></dd>
            <dt class="text-muted">End</dt>
            <dd id="end" class=""></dd>
          </dl>
        </div>
      </div>
      <div class="modal-footer rounded-0">
        {% if is_admin %}
        <button
          type="button"
          class="btn btn-primary btn-sm rounded-0"
          id="edit"
          data-id=""
        >
          Edit
        </button>
        <button
          type="button"
          class="btn btn-danger btn-sm rounded-0"
          id="delete"
          data-id=""
        >
          Delete
        </button>
        {% endif %}
        <button
          type="button"
          class="btn btn-secondary btn-sm rounded-0"
          data-bs-dismiss="modal"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'studentlife/newmain.js' %}"></script>

{% endblock bodycontent %}
