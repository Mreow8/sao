{% extends 'adminmain.html' %}
{% load static %}
{% block bodycontent %}

<style>
  .upload-container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    background-color: #f3f3f3;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    font-family: Arial, sans-serif;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  form {
    margin-top: 20px;
  }

  form p {
    margin-bottom: 15px;
  }

  button {
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }


</style>
 <div class="sub-title">
    <h3>OFFICE OF STUDENT LIFE</h3>
    <p class="hometext">Home</p>
    <p class="certxt">&gt; Upload CSV</p>
  </div>
<div class="upload-container">

  {% if messages %}
    <ul>
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
  </form>
</div>
{% endblock %}
