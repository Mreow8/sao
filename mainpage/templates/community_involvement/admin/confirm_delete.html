{% extends base_template|default:"adminmain.html" %} {% block bodycontent %}
<div class="container mt-5">
  <h2>Are you sure?</h2>
  <p>
    You are about to delete the program: <strong>{{ program.title }}</strong>.
    This action cannot be undone.
  </p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete it</button>
    <a href="{% url 'programs' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
