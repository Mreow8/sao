{% block bodycontent %}

<div class="data">
  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Donated</th>
          <th>Name</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        {% for donates in loadGcashDonations %}
        <tr>
          <td>{{ donates.donated }}</td>
          <td>{{ donates.name }}</td>
          <td>{{ donates.amount }}</td>
          <td>{{ donates.date }}</td>
          =-
          <td class="view">
            <a target="_blank" href="/media/{{ donates.image_details }}"
              >View</a
            >
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
