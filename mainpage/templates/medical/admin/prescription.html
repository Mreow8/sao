{% extends 'adminmain.html' %} {% load static %}
<!-- prettier-ignore -->

{% block title %}HealthHub Connect | Prescription Issuance{% endblock %} 

{% block extra_css %}
{% endblock %} {% block bodycontent %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link
  rel="stylesheet"
  href="{% static 'styles/medical/admin/prescription.css' %}"
/>
<div class="sub-title">
  <h3>MEDICAL</h3>
  <p class="hometext"><a href="{% url 'homepage' %}">Home</a></p>
  <p class="certxt">&gt; Prescription Issuance</p>
</div>
<div class="main-container">
  <form method="POST" class="prescription-form">
    {% csrf_token %}

    <div class="form-group">
      <label for="student_id">ID Number</label>
      <div class="input-group autocomplete">
        <input
          type="text"
          id="student_id"
          name="student_id"
          required
          autocomplete="off"
        />
        <button type="button" id="btn-get" class="btn btn-get">Get</button>
        <div id="suggestions-box" class="suggestions-list"></div>
      </div>
      <span
        id="id-error-message"
        style="color: red"
        class="error-message"
      ></span>
    </div>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="problem">Problem</label>
      <input type="text" id="problem" name="problem" required />
    </div>

    <div class="form-group">
      <label for="treatment">Treatment</label>
      <textarea id="treatment" name="treatment" rows="4" required></textarea>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date_prescribed" required />
    </div>

    <div class="button-group">
      <button type="submit" class="btn btn-primary" name="action" value="issue">
        Issue Prescription
      </button>
      <a class="btn btn-secondary" href="{% url 'prescription_records' %}"
        >View Records</a
      >
    </div>
  </form>
</div>
<script>
  const csrf_token = "{{ csrf_token }}";
  var btn = document.getElementById("btn-get");
  const idError = document.getElementById("id-error-message"); // Get the error label

  btn.addEventListener("click", function () {
    var id = document.getElementById("student_id").value;
    const data = { student_id: id };

    // Clear previous errors before making a new request
    idError.textContent = "";
    idError.style.display = "none";

    fetch("/med/getusernamebyid/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrf_token,
      },
      body: JSON.stringify(data),
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.user_name) {
          document.getElementById("name").value = data.user_name;
        } else if (data.error) {
          // Instead of an alert, show the error in the label
          idError.textContent = data.error;
          idError.style.display = "block";
        }
      })
      .catch((error) => {
        console.error("Error fetching user name:", error);
        idError.textContent = "A network error occurred.";
        idError.style.display = "block";
      });
  });
</script>

{% if messages %}
<script>
  // 1. Configure the toast's appearance
  const Toast = Swal.mixin({
    toast: true,
    position: 'top-end', // Position it in the top-right corner
    showConfirmButton: false,
    timer: 3000,
    timerProgressBar: true,
    didOpen: (toast) => {
      toast.addEventListener('mouseenter', Swal.stopTimer);
      toast.addEventListener('mouseleave', Swal.resumeTimer);
    }
  });

  // 2. Loop through messages and show a toast for each one
  {% for message in messages %}
  Toast.fire({
    icon: '{% if "success" in message.tags %}success{% elif "error" in message.tags %}error{% else %}info{% endif %}',
    title: '{{ message|escapejs }}'
  });
  {% endfor %}
</script>
{% endif %}

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const studentIdInput = document.getElementById("student_id");
    const nameInput = document.getElementById("name");
    const suggestionsBox = document.getElementById("suggestions-box");

    studentIdInput.addEventListener("input", async function () {
      const query = this.value.trim();

      if (query.length < 2) {
        // Start searching after 2 characters
        suggestionsBox.innerHTML = "";
        suggestionsBox.style.display = "none";
        return;
      }

      const response = await fetch(
        `/med/user-suggestions/?q=${encodeURIComponent(query)}`
      );
      const suggestions = await response.json();

      suggestionsBox.innerHTML = "";
      if (suggestions.length > 0) {
        suggestions.forEach((item) => {
          const div = document.createElement("div");
          div.textContent = `${item.name} (${item.id})`;
          div.dataset.id = item.id;
          div.dataset.name = item.name;
          div.classList.add("suggestion-item");
          suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = "block";
      } else {
        suggestionsBox.style.display = "none";
      }
    });

    // Handle clicking on a suggestion
    suggestionsBox.addEventListener("click", function (e) {
      if (e.target.classList.contains("suggestion-item")) {
        studentIdInput.value = e.target.dataset.id;
        nameInput.value = e.target.dataset.name;
        suggestionsBox.innerHTML = "";
        suggestionsBox.style.display = "none";
      }
    });

    // Hide suggestions when clicking outside
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".autocomplete")) {
        suggestionsBox.innerHTML = "";
        suggestionsBox.style.display = "none";
      }
    });
  });
</script>
{% endblock %}
