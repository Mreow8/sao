{% extends 'adminmain.html' %}{% block headcontent %} {% load static %}
<link
  rel="stylesheet"
  href="{% static 'styles/medical/admin/prescription.css' %}"
/>
{% endblock headcontent %} {% block bodycontent %} {% load static %}
<div class="container">
  {% if messages %} {% for message in messages %}
  <p class="message {% if message.tags %}{{ message.tags }}{% endif %}">
    {{ message }}
  </p>
  {% endfor %} {% endif %}
  <h2>Prescription Issuance</h2>
  <form method="POST" class="prescription-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="student_id">Student ID:</label>
      <input type="text" id="student_id" name="student_id" required />
    </div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
    </div>
    <div class="form-group">
      <label for="problem">Problem:</label>
      <input type="text" id="problem" name="problem" required />
    </div>
    <div class="form-group">
      <label for="treatment">Treatment:</label>
      <textarea id="treatment" name="treatment" rows="4" required></textarea>
    </div>
    <div class="form-group">
      <label for="date">Date:</label>
      <input type="date" id="date" name="date_prescribed" required />
    </div>
    <div style="display: flex">
      <button type="submit" class="action-button" name="action" value="issue">
        Issue Prescription
      </button>
      <a class="schedule-button" href="{% url 'medical:prescription_records' %}"
        >View Records</a
      >
    </div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const studentIdInput = document.getElementById("student_id");
    const nameInput = document.getElementById("name");

    studentIdInput.addEventListener("change", function () {
      const studentId = this.value;
      fetch(`/api/get_student_name/?student_id=${studentId}`)
        .then((response) => response.json())
        .then((data) => {
          nameInput.value = data.name;
        })
        .catch((error) => {
          console.error("Error:", error);
        });
    });
  });
</script>
{% endblock %}
