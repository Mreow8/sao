{% extends 'adminmain.html' %} {% load static %} {% block title %}HealthHub
Connect | Emergency Health Assistance{% endblock %} {% block extra_css %}
<!-- prettier-ignore -->
{% endblock %} {% block bodycontent %}<link
  rel="stylesheet"
  href="{% static 'styles/medical/admin/emergency_assistance.css' %}"
/>
<div class="main-container">
  <h2 class="page-title">Emergency Health Assistance</h2>

  <form method="POST" class="assistance-form">
    {% csrf_token %}

    <div class="form-group">
      <label for="student_id">ID Number</label>
      <div class="input-group autocomplete">
        <input
          type="text"
          id="student_id"
          name="student_id"
          required
          autocomplete="off"
        />
        <button type="button" id="btn-get" class="btn btn-get">Get</button>
        <div id="suggestions-box" class="suggestions-list"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="problem">Reason</label>
      <input type="text" id="problem" name="problem" required />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date_assisted" required />
    </div>

    <div class="button-group">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="{% url 'emergency_health_records' %}"
        >View Records</a
      >
    </div>
  </form>
</div>
{% endblock %} {% block extra_js %}
<script>
  const csrf_token = "{{ csrf_token }}";
  var btn = document.getElementById("btn-get");

  btn.addEventListener("click", function () {
    var id = document.getElementById("student_id").value;
    const data = { student_id: id };

    fetch("/medical/getusernamebyid/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrf_token,
      },
      body: JSON.stringify(data),
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.user_name) {
          document.getElementById("name").value = data.user_name;
        } else if (data.error) {
          alert(data.error);
        }
      });
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const studentIdInput = document.getElementById("student_id");
    const nameInput = document.getElementById("name");
    const suggestionsBox = document.getElementById("suggestions-box");

    studentIdInput.addEventListener("input", async function () {
      const query = this.value.trim();

      if (query.length < 2) {
        suggestionsBox.style.display = "none";
        return;
      }

      const response = await fetch(
        `/medical/user-suggestions/?q=${encodeURIComponent(query)}`
      );
      const suggestions = await response.json();

      suggestionsBox.innerHTML = "";
      if (suggestions.length > 0) {
        suggestions.forEach((item) => {
          const div = document.createElement("div");
          div.textContent = `${item.name} (${item.id})`;
          div.dataset.id = item.id;
          div.dataset.name = item.name;
          div.classList.add("suggestion-item");
          suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = "block";
      } else {
        suggestionsBox.style.display = "none";
      }
    });

    suggestionsBox.addEventListener("click", function (e) {
      if (e.target.classList.contains("suggestion-item")) {
        studentIdInput.value = e.target.dataset.id;
        nameInput.value = e.target.dataset.name;
        suggestionsBox.style.display = "none";
      }
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".autocomplete")) {
        suggestionsBox.style.display = "none";
      }
    });
  });
</script>
{% endblock %}
