{% extends 'mainv2.html' %} {% load static tailwind_tags %}
<!-- prettier-ignore -->
{% block title %} HealthHub Connect | Dental Request {% endblock %}

{% block extra_css %} 
{% tailwind_css %}
{% endblock %}

{% block bodycontent %}
<style>
  .upload {
    background-color: #ff8000;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
</style>

<div class="sub-title">
  <h3>Medical</h3>
  <p class="hometext">Home</p>
  <p class="certxt">&gt; Dental Request Form</p>
</div>

<div
  class="bg-white h-screen xs:p-4 lg:p-8 flex flex-col gap-2 rounded-[18px] xs:w-full md:w-[60%]"
>
  <form method="POST" class="flex flex-col justify-between h-full">
    {% csrf_token %}
    <div class="flex flex-col">
      <div class="flex bg-[#e6e6e6] p-2">
        <label
          class="w-full text-center font-bold xs:text-[14px] md:text-base"
          for="studentId"
          >ID Number</label
        >
        <label
          class="w-full text-center font-bold xs:text-[14px] md:text-base"
          for="requestType"
          >Service Type</label
        >
      </div>
      <div class="flex gap-2 py-2">
        <!-- Added border, padding, rounded corners, and focus styles -->
        <input
          class="w-full xs:text-[14px] md:text-base border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
          type="text"
          id="student_id"
          name="student_id"
          value="{{ id_number }}"
          readonly
        />
        <select
          class="w-full xs:text-[14px] md:text-base border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
          id="requestType"
          name="service_type"
          required
        >
          <option value="">Select Service Type</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Dental Filling">Dental Filling</option>
          <option value="Tooth Extraction">Tooth Extraction</option>
        </select>
      </div>
    </div>

    <input class="upload" type="submit" value="Submit" />
  </form>
</div>
{% endblock %}
