{% extends 'main.html' %}{% block bodycontent %}
<div class="max-w-3xl w-full mx-auto bg-white mt-10 p-8 rounded-lg shadow-md">
  {% if messages %} {% for message in messages %}
  <p
    class="px-4 py-2 rounded text-sm my-2 {% if message.tags == 'info' %} bg-blue-100 text-blue-800 border border-blue-300 {% elif message.tags == 'success' %} bg-green-100 text-green-800 border border-green-300 {% elif message.tags == 'error' %} bg-red-100 text-red-800 border border-red-300 {% else %} bg-gray-100 text-gray-800 border border-gray-300 {% endif %}"
  >
    {{ message }}
  </p>
  {% endfor %} {% endif %}

  <h2 class="text-2xl font-semibold text-gray-800 text-center">
    Submit a Request
  </h2>
  <form method="POST" class="mt-8">
    <!-- Remove Student ID input -->
<form method="POST" class="mt-8">
  {% csrf_token %}
  <div class="overflow-x-auto">
    <table class="w-full border border-gray-300 text-sm">
      <thead>
        <tr class="bg-gray-100 text-left">
          <th class="p-3 border">Request Type:</th>
          <th class="p-3 border">Action:</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="p-3 border">
            <select
              id="requestType"
              name="request_type"
              required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm"
            >
              <option value="">Select Request Type</option>
              <option value="Eligibility Form">Eligibility Form</option>
              <option value="Medical Certificate for Intramurals">
                Medical Certificate for Intramurals
              </option>
              <option value="Medical Clearance for OJT/Practicum">
                Medical Clearance for OJT/Practicum
              </option>
            </select>
          </td>
          <td class="p-3 border text-center">
            <button
              type="submit"
              class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded"
            >
              Submit
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</form>
</div>
{% endblock %}
