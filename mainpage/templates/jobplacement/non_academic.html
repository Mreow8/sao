{% extends 'adminmain.html' %} 

{% block headcontent %}
{% load static %}
<link
  rel="stylesheet"
  href="{% static 'styles/job_placement/non_acad.css' %}?307"
/>

<style>
  #student_details {
    padding: 10px;
    margin-top: 10px;
    background-color: #f4f4f4;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  #student_details p {
    margin: 5px 0;
  }
  .hidden {
    display: none;
  }
</style>
{% endblock headcontent %} 

{% block bodycontent %}
<div class="container">
  <div class="sub-title">
    <h4>STUDENT LIFE (Admin)</h4>
    <p class="hometext"><a href="{% url 'homepage' %}">Home</a></p>
    <p class="certxt">&gt;  Non-Academic Award Issuance</p>
</p>

  </div>
 
  <hr id="demo" />
  <div class="showbox">
    <form action="" method="POST">
      {% csrf_token %}
      
      <input id="stud_id_holder" type="hidden" name="student_id" />

      <label for="date">Date Issued: </label>
      <input type="date" name="date_issued" required />

      <label for="student">Student: </label>
      <div id="suggestions_container">
        <div>
            <input
                type="text"
                name="student_search_box" id="id_student"
                list="student-options"
                placeholder="Enter Student ID"
                required />
            <datalist id="student-options">
                {% for student in students %}
                <option value="{{ student.studID }}">
                    {{ student.firstname }} {{ student.lastname }}
                </option>
                {% endfor %}
            </datalist>
        </div>

        <div id="student_details" class="hidden">
            <p><strong>Name:</strong> <span id="student_name"></span></p>
            <p><strong>Course:</strong> <span id="student_course"></span></p>
            <p><strong>Year:</strong> <span id="student_year"></span></p>
        </div>

      </div>

      <label for="program">Program/Course:</label>
      <select name="program" id="program_select">
        <option value="None" selected>----------</option>
        <option value="AGRICULTURE">Agriculture</option>
        <option value="BIT">Bachelor of Industrial Technology</option>
        <option value="BES">Bachelor of Environmental Science</option>
        <option value="BSHM">
          Bachelor of Science Hospitality and Management
        </option>
        <option value="BSIE">Bachelor of Industrial Engineering</option>
        <option value="BSIT">
          Bachelor of Science Information and Technology
        </option>
        <option value="CAS">Bachelor of Crafts Arts and Science</option>
        <option value="COED">College of Education</option>
        <option value="FORESTRY">Bachelor of Science and Forestry</option>
      </select>

      <label for="award">Non-Academic Award:</label>
      <select name="award" id="award_select">
        <option value="None">----------</option>
      </select>

      <div class="hidden_fields" id="ojt_fields">
        <label for="position">Position:</label>
        <input type="text" name="position" />

        <label for="company_name">Company Name:</label>
        <input type="text" name="company_name" />

        <label for="company_address">Company Address:</label>
        <input type="text" name="company_address" />
      </div>

      <div class="hidden_fields" id="capstone_fields">
        <label for="title">Capstone Title</label>
        <input type="text" name="capstone_title" />
      </div>

      <div class="hidden_fields" id="leadership_fields">
        <label for="acad_year">Academic Year:</label>
        <input
          type="text"
          name="acad_year"
          id="acad_year"
          placeholder="YYYY-YYYY"
          pattern="\d{4}-\d{4}"
          title="Enter a year range in the format YYYY-YYYY"
        />
      </div>

      <div class="hidden_fields" id="research_fields">
        <label for="research_title">Research Title:</label>
        <input type="text" name="research_title" />
      </div>

      <div class="hidden_fields" id="Others">
        <label for="achievement">Achievement Title:</label>
        <input
          type="text"
          name="achievement"
          placeholder="New achievement Title"
        />

        <label for="acad_year">Academic Year:</label>
        <input
          type="text"
          name="acad_year"
          id="acad_year"
          placeholder="YYYY-YYYY"
          pattern="\d{4}-\d{4}"
          title="Enter a year range in the format YYYY-YYYY"
        />
      </div>


      <input type="submit" value="Submit" />
    </form>
  </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Student Search AJAX
        const studentInput = document.getElementById("id_student");
        const studentDetails = document.getElementById("student_details");
        const studentHiddenInput = document.getElementById("stud_id_holder");

        function fetchStudentDetails(studentID) {
            if (!studentID) {
                studentDetails.classList.add("hidden");
                studentHiddenInput.value = ""; // Clear hidden input
                return;
            }
            
            // This URL is copied from case_profile.html
            // Make sure it's the correct endpoint for your project!
            fetch(`/discipline/get-student/${studentID}/`)
                .then((response) => response.json())
                .then((data) => {
                    if (data.found) {
                        // Populate display fields
                        document.getElementById("student_name").textContent = data.name;
                        document.getElementById("student_course").textContent = data.course;
                        document.getElementById("student_year").textContent = data.year;
                        studentDetails.classList.remove("hidden");

                        // *** IMPORTANT MODIFICATION ***
                        // Set the value of the real hidden input for the form
                        studentHiddenInput.value = studentID;

                    } else {
                        studentDetails.classList.add("hidden");
                        studentHiddenInput.value = ""; // Clear hidden input
                    }
                });
        }

        studentInput.addEventListener("input", function () {
            fetchStudentDetails(this.value.trim());
        });
        studentInput.addEventListener("change", function () {
            fetchStudentDetails(this.value.trim());
        });
        
    });
</script>

<script src="{% static 'scripts/job_placement/non_academic.js' %}?309"></script>
{% endblock bodycontent %}
