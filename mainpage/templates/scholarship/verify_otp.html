{% load static %} <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* --- Base & Typography (from login.html) --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif; /* */
        background-color: #f8f9fa;
      }

      /* --- Main Layout (from login.html) --- */
      .containers {
        display: flex;
        height: 100vh;
        width: 100%;
        overflow: hidden; /* */
      }

      /* --- Left Section (Branding) (from login.html) --- */
      .left-section {
        flex: 1;
        background: url("{% static 'imgs/CTU.jpg' %}") no-repeat center center; /* */
        background-size: cover;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 40px;
        text-align: center; /* */
      }

      .left-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5); /* */
        z-index: 1;
      }

      .left-section img,
      .left-section p {
        position: relative;
        z-index: 2; /* */
      }

      .left-section img {
        width: 150px;
        margin-bottom: 25px; /* */
      }

      .left-section p {
        color: white;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 1px; /* */
      }

      /* --- Right Section (Form) (from login.html) --- */
      .right-section {
        flex: 1;
        background-color: #2c5282; /* */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        overflow-y: auto; /* */
      }

      /* --- Verification Card (Styled like .login-box) --- */
      .verification-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px; /* */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        max-width: 450px;
        width: 100%;
        color: #333;
      }

      .verification-card h2 {
        font-size: 24px;
        color: #1a1a1a;
        font-weight: 700;
        margin-bottom: 25px; /* */
        text-align: center;
      }

      .verification-card p {
        text-align: center;
        color: #555;
        font-size: 1.05rem;
        margin-bottom: 1.5rem;
      }

      .form-label {
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      .form-control {
        width: 100%;
        padding: 12px 15px;
        background: #f9f9f9; /* */
        border: 1px solid #ccc;
        border-radius: 8px; /* */
        font-family: "Rubik", sans-serif;
        color: #333;
        transition: all 0.3s ease;
        font-size: 1.25rem;
        text-align: center;
        letter-spacing: 0.5rem;
      }

      .form-control:focus {
        outline: none;
        border-color: #2c5282;
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.3); /* */
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background-color: #2c5282; /* */
        color: white;
        border: none;
        font-size: 16px;
        font-family: "Rubik", sans-serif;
        border-radius: 8px; /* */
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: background-color 0.2s, transform 0.2s;
      }

      .btn-primary:hover {
        background-color: #2a4365; /* */
        transform: translateY(-2px);
      }

      .alert {
        border-radius: 8px;
        font-size: 14px;
      }

      /* --- Responsive Design (from login.html) --- */
      @media (max-width: 900px) {
        .containers {
          background: url("{% static 'imgs/signinBackground.jpg' %}") no-repeat
            center center; /* */
          background-size: cover;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
          height: auto;
          min-height: 100vh;
        }

        .containers::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5); /* */
          z-index: 1;
        }

        .left-section {
          display: none; /* */
        }

        .right-section {
          flex: none;
          width: 90%;
          max-width: 450px; /* Adjusted for verify card */
          background-color: transparent;
          padding: 0;
          position: relative;
          z-index: 2; /* */
        }

        .verification-card {
          background-color: rgba(255, 255, 255, 0.95); /* */
          padding: 30px;
          margin: 20px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="containers">
      <div class="left-section">
        <img src="{% static 'imgs/ctu_logo.png' %}" alt="CTU Logo" />
        <p>WELCOME</p>
      </div>

      <div class="right-section">
        <div class="verification-card">
          <h2>Email Verification</h2>

          {% if messages %} {% for message in messages %}
          <div class="alert alert-info">{{ message }}</div>
          {% endfor %} {% endif %} {% if error_message %}
          <div class="alert alert-danger">{{ error_message }}</div>
          {% endif %}

          <p>
            A 6-digit verification code was sent to
            <strong>{{ email }}</strong>.
          </p>

          <form
            method="POST"
            action="{% url 'verify_otp_page' user_id=user_id %}"
          >
            {% csrf_token %}
            <div class="mb-3">
              <label for="otp" class="form-label">Enter OTP:</label>
              <input
                type="text"
                name="otp"
                id="otp"
                maxlength="6"
                class="form-control"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary mt-3">Verify</button>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
