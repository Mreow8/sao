{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Register - CTU</title>
    <style>
      /* --- [NEW] Import Rubik Font --- */
      @import url("https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap");

      /* --- Base & Typography --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        /* [THEME] Use Rubik Font */
        font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8f9fa;
      }

      /* --- Main Layout --- */
      .container {
        display: flex;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      /* --- Left Section (Branding) --- */
      .left-section {
        flex: 1;
        background: url("{% static 'imgs/CTU.jpg' %}") no-repeat center center;
        background-size: cover;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 40px;
        text-align: center;
      }

      .left-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
      }

      .left-section img,
      .left-section p {
        position: relative;
        z-index: 2;
      }

      .left-section img {
        width: 150px;
        margin-bottom: 25px;
      }

      .left-section p {
        color: white;
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      /* --- Right Section (Registration Form) --- */
      .right-section {
        flex: 1;
        /* [THEME] Use Primary Blue from requestgmc.css */
        background-color: #2c5282;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        overflow-y: auto;
      }

      /* [THEME] Styled like .gmc-form */
      .register-box {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        color: #333;
      }

      .register-box h2 {
        font-size: 24px;
        color: #1a1a1a;
        font-weight: 700;
        margin-bottom: 25px;
        text-align: center;
      }

      /* --- Form Elements --- */
      .form-group {
        margin-bottom: 20px;
      }

      /* [THEME] Styled like #comboBox */
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        background: #f9f9f9; /* Light input background */
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        font-family: "Rubik", sans-serif; /* Ensure font */
        color: #333;
        transition: all 0.3s ease;
      }

      /* [THEME] Focus style from requestgmc.css */
      input:focus {
        outline: none;
        border-color: #2c5282; /* Primary Blue */
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.3); /* Blue focus ring */
      }

      input::placeholder {
        color: #adb5bd;
      }

      /* [THEME] Styled like .requestBtn */
      .btn-register {
        width: 100%;
        padding: 12px;
        background-color: #2c5282; /* Primary Blue */
        color: white;
        border: none;

        font-size: 16px;
        font-family: "Rubik", sans-serif;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase; /* Added for consistency */
        letter-spacing: 0.5px; /* Added for consistency */
        transition: background-color 0.2s, transform 0.2s;
      }

      .btn-register:hover {
        background-color: #2a4365; /* Darker Blue */
        transform: translateY(-2px); /* Added for consistency */
      }

      /* --- Footer & Messages --- */
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #6c757d;
      }
      .footer a {
        /* [THEME] Use Primary Blue for link */
        color: #2c5282;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }

      /* [THEME] Styled like .pending-request-box (Red) */
      .error-message {
        color: #c53030; /* Dark Red */
        background-color: #fff5f5; /* Light Red */
        border: 1px solid #fc8181; /* Red border */
        border-left: 5px solid #c53030; /* Red accent */
        padding: 1rem;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 15px;
        text-align: left; /* Changed for readability */
      }

      /* [THEME] Styled like .pending-request-box (Green) */
      .success-message {
        color: #2f855a; /* Dark Green */
        background-color: #f0fff4; /* Light Green */
        border: 1px solid #9ae6b4; /* Green border */
        border-left: 5px solid #2f855a; /* Green accent */
        padding: 1rem;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 15px;
        text-align: left; /* Changed for readability */
      }

      /* --- Responsive Design --- */
      @media (max-width: 900px) {
        .container {
          /* ✅ FIXED: Use same background as Login for consistency */
          background: url("{% static 'imgs/CTU.jpg' %}") no-repeat center center;
          background-size: cover;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
          height: auto;
          min-height: 100vh;
        }

        .container::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 1;
        }

        .left-section {
          display: none;
        }

        .right-section {
          flex: none;
          width: 90%;
          max-width: 400px;
          background-color: transparent;
          padding: 0;
          position: relative;
          z-index: 2;
        }

        .register-box {
          background-color: rgba(
            255,
            255,
            255,
            0.95
          ); /* Slightly less transparent */
          padding: 30px;
          border-radius: 12px;
          width: 100%;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
          margin: 20px 0;
        }

        .footer {
          color: #4d4d4d;
        }
      }

      @media (max-width: 480px) {
        .register-box {
          padding: 25px;
        }
        .right-section {
          padding: 10px;
          width: 100%; /* Use full width */
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left-section">
        <img src="{% static 'imgs/ctu_logo.png' %}" alt="CTU Logo" />
        <p>WELCOME</p>
      </div>

      <div class="right-section">
        <div class="register-box">
          <h2>Account Registration</h2>

          {% if error_message %}
          <div class="error-message">{{ error_message }}</div>
          {% endif %} {% if success_message %}
          <div class="success-message">{{ success_message }}</div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <input
                type="text"
                placeholder="ID Number"
                id="studID"
                name="studID"
                value="{{ studID_value|default:'' }}"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="email"
                placeholder="Email Address"
                id="email"
                name="email"
                value="{{ email_value|default:'' }}"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="password"
                placeholder="Password (min 8 characters)"
                id="password"
                name="password"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="password"
                placeholder="Confirm Password"
                id="cpassword"
                name="cpassword"
                required
              />
            </div>

            <button type="submit" class="btn-register">Register</button>
          </form>

          <div class="footer">
            Already have an account?
            <a href="{% url 'signinuser' %}">Sign in</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Select all the inputs in this form
        const studIDInput = document.querySelector('input[name="studID"]');
        const emailInput = document.querySelector('input[name="email"]');
        const passwordInput = document.querySelector('input[name="password"]');
        const cpasswordInput = document.querySelector(
          'input[name="cpassword"]'
        );

        // Select the error message
        const errorMessage = document.querySelector(".error-message");

        // Function to hide the error message
        function hideError() {
          if (errorMessage) {
            errorMessage.style.display = "none";
          }
        }

        // List of all inputs to monitor
        const inputs = [studIDInput, emailInput, passwordInput, cpasswordInput];

        // Add an event listener to every input
        // 'focus' fires when the user clicks into the input
        inputs.forEach(function (input) {
          if (input) {
            input.addEventListener("focus", hideError);
          }
        });
      });
    </script>
  </body>
</html>
