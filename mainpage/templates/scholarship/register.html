{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Register - CTU</title>
    <style>
      /* --- Base & Typography --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: #f8f9fa; /* Light background */
      }

      /* --- Main Layout --- */
      .container {
        display: flex;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      /* --- Left Section (Branding - Same as Login) --- */
      .left-section {
        flex: 1;
        background: url("{% static 'imgs/signinBackground.jpg' %}") no-repeat
          center center;
        background-size: cover;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 40px;
        text-align: center;
      }

      /* Dark overlay for better text contrast */
      .left-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5); /* Semi-transparent overlay */
        z-index: 1;
      }

      .left-section img,
      .left-section p {
        position: relative;
        z-index: 2;
      }

      .left-section img {
        width: 150px; /* Logo size */
        margin-bottom: 25px;
      }

      .left-section p {
        color: white;
        font-size: 48px; /* Welcome text size */
        font-weight: 700;
        letter-spacing: 1px;
      }

      /* --- Right Section (Registration Form - Same background as Login) --- */
      .right-section {
        flex: 1;
        background-color: #3e74a0; /* Consistent background from login */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        overflow-y: auto; /* Allow scrolling if content overflows */
      }

      /* Registration Box (Styled like login-box) */
      .register-box {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px; /* Slightly wider to accommodate more fields if needed */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        color: #333;
      }

      .register-box h2 {
        font-size: 24px;
        color: #1a1a1a;
        font-weight: 700;
        margin-bottom: 25px;
        text-align: center; /* Center the heading */
      }

      /* --- Form Elements (Styled like Login) --- */
      .form-group {
        margin-bottom: 20px; /* Consistent spacing */
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 15px; /* Consistent padding */
        background: #f0f2f5; /* Light input background */
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        color: #333;
        transition: all 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #ff8000; /* Orange focus border */
        background-color: #fff;
      }

      input::placeholder {
        color: #adb5bd;
      }

      .btn-register {
        width: 100%;
        padding: 12px;
        background-color: #ff8000; /* Orange button */
        color: white;
        border: none;
        font-weight: 600;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .btn-register:hover {
        background-color: #e67300; /* Darker orange on hover */
      }

      /* --- Footer & Error/Success Messages (Styled like Login) --- */
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #6c757d;
      }
      .footer a {
        color: #ff8000; /* Orange link */
        text-decoration: none;
        font-weight: 600;
      }
      .footer a:hover {
        text-decoration: underline;
      }

      .error-message {
        color: #dc3545; /* Red error text */
        background-color: #f8d7da; /* Light red background */
        border: 1px solid #f5c6cb;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 15px;
        text-align: center;
      }

      .success-message {
        color: #198754; /* Green success text */
        background-color: #d1e7dd; /* Light green background */
        border: 1px solid #badbcc;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 15px;
        text-align: center;
      }

      /* --- Responsive Design (Same breakpoints and logic as Login) --- */
      @media (max-width: 900px) {
        .container {
          /* Apply the background image to the container itself */
          background: url("{% static 'imgs/signinBackground.jpg' %}") no-repeat
            center center;
          background-size: cover;
          position: relative; /* Needed for the overlay */
          display: flex; /* Re-enable flex to center the right section */
          justify-content: center;
          align-items: center;
          padding: 20px; /* Add some padding */
          height: auto; /* Adjust height for potentially longer form */
          min-height: 100vh; /* Ensure it covers viewport height */
        }

        /* Add an overlay to the container for readability */
        .container::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5); /* Semi-transparent black overlay */
          z-index: 1;
        }

        .left-section {
          display: none; /* Hide the original left section div */
        }

        .right-section {
          flex: none; /* Override the desktop flex setting */
          width: 90%;
          max-width: 400px;
          background-color: transparent; /* Make it transparent */
          padding: 0; /* Remove padding, handled by register-box */
          position: relative; /* Ensure it's above the overlay */
          z-index: 2;
          /* Remove align-items to allow top alignment if content overflows */
        }

        .register-box {
          background-color: rgba(
            255,
            255,
            255,
            0.9
          ); /* White with slight transparency */
          padding: 30px;
          border-radius: 12px;
          width: 100%;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); /* Keep a subtle shadow */
          margin: 20px 0; /* Add some margin top/bottom */
        }

        .footer {
          color: #4d4d4d; /* Keep footer text readable */
        }
      }

      @media (max-width: 480px) {
        .register-box {
          padding: 25px; /* Adjust padding for very small screens */
        }
        .right-section {
          padding: 10px; /* Add padding back to right section on smallest screens */
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Left background and logo -->
      <div class="left-section">
        <img src="{% static 'imgs/ctu_logo.png' %}" alt="CTU Logo" />
        <p>WELCOME</p>
      </div>

      <!-- Right registration form -->
      <div class="right-section">
        <div class="register-box">
          <h2>Student Registration</h2>

          {% if error_message %}
          <div class="error-message">{{ error_message }}</div>
          {% endif %} {% if success_message %}
          <div class="success-message">{{ success_message }}</div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <input
                type="text"
                placeholder="Student ID"
                id="studID"
                name="studID"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="email"
                placeholder="Email Address"
                id="email"
                name="email"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                placeholder="Password (min 8 characters)"
                id="password"
                name="password"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                placeholder="Confirm Password"
                id="cpassword"
                name="cpassword"
                required
              />
            </div>
            <button type="submit" class="btn-register">Register</button>
          </form>

          <div class="footer">
            Already have an account?
            <a href="{% url 'signinuser' %}">Sign in</a>
          </div>
        </div>
      </div>
    </div>

    {% if success_message %}
    <script>
      alert("{{ success_message|escapejs }}");
    </script>
    {% endif %}
  </body>
</html>
