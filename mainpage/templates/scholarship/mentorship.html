{% extends "main.html" %}
{% load static %}

{% block headcontent %}
<link rel="stylesheet" href="{% static 'css/mentorship.css' %}">
<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
{% endblock headcontent %}

{% block bodycontent %}
<div class="content_box">
    <div class="search-container">
        <div class="search-icon">
            <i class="fas fa-search"></i>
        </div>
        <input type="text" placeholder="Search...">
        <a href="{% url "logout" %}">
            <button style="padding: 10px 20px; background-color: #FF8000; border-radius: 5px; border: none; margin-left: 520px;">Log out</button>
        </a>
    </div>
    <div class="content">
        <div class="form_div">
            <h1>Mentorship Program</h1>
            <div class="contents">
                <p>The Mentorship Program content is coming soon. Please check back later for updates!</p>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
