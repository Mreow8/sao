{% extends "main.html" %} {% load static %} {% block title %}Student
Organization{% endblock %} {% block headcontent %}
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
/>
<link rel="stylesheet" href="{% static 'studentorg/css/main.css' %}" />
<link rel="stylesheet" href="{% static 'studentorg/css/org.css' %}" />
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  .pages a,
  .pages {
    color: black;
    transition: color 0.3s, transform 0.3s;
    text-decoration: none;
  }

  .pages a:hover {
    color: #ff8000;
    transform: scale(1.1);
  }

  .pf2 {
    list-style-type: none;
    border-bottom: 2px solid #ff8000;
    padding-bottom: 10px;
  }

  .add-org-btn {
    margin: 20px 0 10px 0;
    background: #ff8000;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }

  .add-org-btn:hover {
    background: #e06d00;
    transform: scale(1.05);
  }
</style>
{% endblock %} {% block bodycontent %}
<div class="container">
  <div
    class="headert"
    style="margin-left: 100px; text-align: center; justify-content: center"
  >
    <h1 class="pf2" style="color: black">CTU-AC STUDENT ORGS</h1>
    <p class="pages" style="font-size: 20px; color: black; padding-top: 10px">
      Quick Actions
    </p>
    <button class="add-org-btn" id="addOrgBtn">
      <i class="fa fa-plus"></i> Add Organization
    </button>
    <p class="pages pf2" id="orgLinks">
      <a href="{% url 'Gen_FSTLP_profile' %}">FSTLP</a> -
      <a href="{% url 'Gen_SI_profile' %}">SI++</a> -
      <a href="{% url 'Gen_THEEQUATIONERS_profile' %}">Equationers</a> -
      <a href="{% url 'Gen_SSG_profile' %}">SSG</a> -
      <a href="{% url 'Gen_TECHNOCRATS_profile' %}">Technocrats</a>
    </p>
  </div>

  <div class="row" id="orgImagesRow1">
    <a href="{% url 'Gen_FSTLP_profile' %}" class="image">
      <img src="{% static 'studentorg/css/org1.png' %}" />
    </a>
    <a href="{% url 'Gen_SI_profile' %}" class="image">
      <img src="{% static 'studentorg/css/org2.png' %}" />
    </a>
    <a href="{% url 'Gen_THEEQUATIONERS_profile' %}" class="image">
      <img src="{% static 'studentorg/css/org3.png' %}" />
    </a>
  </div>

  <div class="row" id="orgImagesRow2">
    <a href="{% url 'Gen_SSG_profile' %}" class="image">
      <img src="{% static 'studentorg/css/org4.png' %}" />
    </a>
    <a href="{% url 'Gen_TECHNOCRATS_profile' %}" class="image">
      <img src="{% static 'studentorg/css/org5.png' %}" />
    </a>
  </div>
</div>

<div class="row" id="orgImagesRow1">
  {% for org in orgs %}
  <a href="{% url 'org_profile' slug=org.slug %}" class="image">
    <img src="{{ org.logo.url }}" alt="{{ org.name }}" />
  </a>
  {% endfor %}
</div>

<script>
  document.getElementById("addOrgBtn").addEventListener("click", function () {
    Swal.fire({
      title: "Add New Organization",
      html:
        '<input id="orgName" class="swal2-input" placeholder="Organization Name">' +
        '<input id="orgImg" type="file" accept="image/*" class="swal2-file">',
      focusConfirm: false,
      preConfirm: () => {
        const name = document.getElementById("orgName").value.trim();
        const imgInput = document.getElementById("orgImg");
        const file = imgInput.files[0];
        if (!name || !file) {
          Swal.showValidationMessage(
            "Please fill out all fields and select an image"
          );
          return false;
        }
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = function (e) {
            resolve({ name, imgData: e.target.result });
          };
          reader.readAsDataURL(file);
        });
      },
      showCancelButton: true,
      confirmButtonText: "Add",
    }).then((result) => {
      if (result.isConfirmed && result.value) {
        const formData = new FormData();
        formData.append("name", result.value.name);
        formData.append("imgData", result.value.imgData);

        fetch("{% url 'add_organization' %}", {
          method: "POST",
          headers: {
            "X-CSRFToken": "{{ csrf_token }}",
          },
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              const orgLinks = document.getElementById("orgLinks");
              orgLinks.innerHTML += ` - <a href="/org/${data.slug}/">${data.name}</a>`;

              const orgImagesRow2 = document.getElementById("orgImagesRow2");
              const a = document.createElement("a");
              a.href = `/org/${data.slug}/`;
              a.className = "image";
              a.innerHTML = `<img src="${data.image_url}" alt="${data.name}"/><div style="text-align:center;">${data.name}</div>`;
              orgImagesRow2.appendChild(a);

              Swal.fire("Added!", `${data.name} has been saved.`, "success");
            } else {
              Swal.fire("Error", data.error, "error");
            }
          });
      }
    });
  });
</script>
<script src="{% static 'guidance/scripts/main.js' %}"></script>
{% endblock %}
