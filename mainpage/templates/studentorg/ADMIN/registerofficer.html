{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Officer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap");
      body {
        font-family: "Rubik", sans-serif;
        background-color: #ffffff;
      }

      /* Custom Scrollbar for the iframe content */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="p-6">
    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Officer Registration</h2>
        <p class="text-sm text-gray-500">
          Create credentials for a new student officer.
        </p>
      </div>

      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <div
          class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form
        method="POST"
        action="{% url 'register_officer' %}"
        class="space-y-4"
      >
        {% csrf_token %}

        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
          <h3
            class="text-sm font-bold text-blue-800 mb-3 uppercase tracking-wide"
          >
            Student Information
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="student_id"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Student ID</label
              >
              <input
                type="number"
                id="student_id"
                name="student_id"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
            <div>
              <label
                for="year_lvl"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Year Level</label
              >
              <select
                id="year_lvl"
                name="year_lvl"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              >
                <option value="" disabled selected>Select Year</option>
                <option value="1st">1st Year</option>
                <option value="2nd">2nd Year</option>
                <option value="3rd">3rd Year</option>
                <option value="4th">4th Year</option>
                <option value="Irregular">Irregular</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3">
            <div>
              <label
                for="student_fname"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >First Name</label
              >
              <input
                type="text"
                id="student_fname"
                name="student_fname"
                maxlength="100"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
            <div>
              <label
                for="student_mname"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Middle Name</label
              >
              <input
                type="text"
                id="student_mname"
                name="student_mname"
                maxlength="100"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
            <div>
              <label
                for="student_lname"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Last Name</label
              >
              <input
                type="text"
                id="student_lname"
                name="student_lname"
                maxlength="100"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
          </div>

          <div class="mt-3">
            <label
              for="course"
              class="block text-xs font-semibold text-gray-600 mb-1"
              >Course / Program</label
            >
            <select
              id="course"
              name="course"
              required
              class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
            >
              <option value="" disabled selected>Select Course</option>
              <option value="BSIT">BSIT (Information Technology)</option>
              <option value="BSIE">BSIE (Industrial Engineering)</option>
              <option value="BIT-CT">BIT - Computer Tech</option>
              <option value="BIT-GARMENTS">BIT - Garments</option>
              <option value="BIT-AUTOMOTIVE">BIT - Automotive</option>
              <option value="BIT-DRAFTING">BIT - Drafting</option>
              <option value="BIT-ELECTRONICS">BIT - Electronics</option>
              <option value="BEED">BEED (Elementary Education)</option>
              <option value="BSED-MATH">BSED - Math</option>
              <option value="BTLED">BTLED</option>
              <option value="BSF">BSF (Forestry)</option>
              <option value="BSA">BSA (Agriculture)</option>
              <option value="BAL">BAL (Literature)</option>
              <option value="BAEL">BAEL (English Lang)</option>
              <option value="BS-PSYCHOLOGY">BS Psychology</option>
              <option value="BSHM">BSHM (Hospitality)</option>
              <option value="BSTM">BSTM (Tourism)</option>
            </select>
          </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
          <h3
            class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide"
          >
            Position & Account
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
            <div>
              <label
                for="organization"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Organization</label
              >
              <select
                id="organization"
                name="organization"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              >
                <option value="FSTLP">FSTLP</option>
                <option value="SI++">SI++</option>
                <option value="SSG">SSG</option>
                <option value="THE EQUATIONERS">THE EQUATIONERS</option>
                <option value="TECHNOCRATS">TECHNOCRATS</option>
              </select>
            </div>
            <div>
              <label
                for="officer_position"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Position Title</label
              >
              <input
                type="text"
                id="officer_position"
                name="officer_position"
                maxlength="200"
                required
                placeholder="e.g. President, Secretary"
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="username"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Username</label
              >
              <input
                type="text"
                id="username"
                name="username"
                maxlength="100"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
            <div>
              <label
                for="password"
                class="block text-xs font-semibold text-gray-600 mb-1"
                >Password</label
              >
              <input
                type="password"
                id="password"
                name="password"
                maxlength="128"
                required
                class="w-full rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm py-2"
              />
            </div>
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
          >
            <i class="fas fa-user-plus mr-2"></i> Register Officer
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
