{% extends 'adminmain.html' %} {% block bodycontent %}
<div class="container mx-auto px-4 py-10">
  <div class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-indigo-800 mb-8 text-center">
      Admin Jobfairs
    </h1>

    <form method="post" action="{% url 'admin_jobfairs' %}" class="space-y-6">
      {% csrf_token %}

      <!-- Grid Layout for All Inputs -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Job Title -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Job Title</label
          >
          <input
            type="text"
            name="jobtitle"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Company Name -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Company Name</label
          >
          <input
            type="text"
            name="companyname"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Job Location -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Location</label
          >
          <input
            type="text"
            name="joblocation"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Employment Type -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Employment Type</label
          >
          <select
            name="employmenttype"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="" disabled selected>Select</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Contract">Contract</option>
            <option value="Part-Time">Part-Time</option>
            <option value="Non-Profit">Non-Profit</option>
          </select>
        </div>

        <!-- Job Salary -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Job Salary</label
          >
          <input
            type="text"
            name="jobsalary"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Application Deadline -->
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Application Deadline</label
          >
          <input
            type="date"
            name="applicationdeadline"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <!-- Date Posted -->
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Date Posted</label
          >
          <input
            type="date"
            name="posted_date"
            value="{{ today|date:'Y-m-d' }}"
            required
            class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <!-- Job Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Job Description</label
        >
        <textarea
          name="jobdescription"
          required
          class="w-full bg-gray-50 text-base text-gray-900 border border-gray-400 rounded-md p-3 h-36 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <div class="text-center">
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
