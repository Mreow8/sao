{% extends 'adminmain.html' %} {% block bodycontent %} {% load static %}
<style>
  @media (max-width: 768px) {
    .sub-title h3 {
      font-size: 18px;
    }

    .sub-title p {
      font-size: 13px;
    }

    h1 {
      font-size: 22px;
    }

    form label {
      font-size: 13px;
    }

    input,
    textarea,
    select {
      font-size: 14px;
      padding: 8px 10px;
    }

    button[type="submit"] {
      font-size: 13px;
      padding: 8px 16px;
    }
  }

  @media (max-width: 480px) {
    .sub-title h3 {
      font-size: 16px;
    }

    .sub-title p {
      font-size: 12px;
    }

    h1 {
      font-size: 20px;
    }

    input,
    textarea,
    select {
      font-size: 13px;
      padding: 6px 8px;
    }

    button[type="submit"] {
      font-size: 12px;
      padding: 6px 12px;
    }
  }
  /* 🔹 General input & textarea styles */
  input[type="text"],
  input[type="date"],
  input[type="file"],
  textarea,
  select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d1d5db; /* gray-300 */
    border-radius: 8px;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    background-color: #fff;
  }

  /* 🔹 Hover & focus effects */
  input[type="text"]:focus,
  input[type="date"]:focus,
  input[type="file"]:focus,
  textarea:focus,
  select:focus {
    border-color: #fb923c; /* orange-400 */
    box-shadow: 0 0 0 2px rgba(251, 146, 60, 0.3);
  }

  /* 🔹 File input customization */
  input[type="file"] {
    padding: 8px;
    font-size: 14px;
    border: none;
    background: #fff3eb;
    color: #ea580c; /* orange-600 */
    cursor: pointer;
  }

  input[type="file"]::-webkit-file-upload-button {
    background: #f97316; /* orange-500 */
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  input[type="file"]::-webkit-file-upload-button:hover {
    background: #ea580c; /* orange-600 */
  }

  /* 🔹 Responsive adjustments */
  @media (max-width: 768px) {
    input,
    textarea,
    select {
      font-size: 14px;
      padding: 10px 12px;
    }
  }

  @media (max-width: 480px) {
    input,
    textarea,
    select {
      font-size: 13px;
      padding: 8px 10px;
    }
  }
</style>
<div class="sub-title">
  <h3>Alumni</h3>
  <p class="hometext">Home</p>
  <p class="certxt">&gt; Admin Events</p>
</div>
<section class="min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl p-10">
      {% if messages %} {% for message in messages %}
      <div
        class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 rounded-lg mb-6 text-center font-semibold"
      >
        {{ message }}
      </div>
      {% endfor %} {% endif %}

      <form
        method="post"
        action="{% url 'admin_events' %}"
        enctype="multipart/form-data"
        class="space-y-6"
      >
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Name</label
            >
            <input
              type="text"
              name="eventsName"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Date</label
            >
            <input
              type="date"
              name="eventsDate"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Location</label
            >
            <input
              type="text"
              name="eventsLocation"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Event Description</label
          >
          <textarea
            name="eventsDescription"
            required
            class="w-full h-40 px-4 py-3 border border-gray-300 rounded-lg shadow-sm resize-none focus:outline-none focus:ring-2 focus:ring-orange-400"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Upload Image</label
          >
          <input
            type="file"
            name="eventsImage"
            required
            class="file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100"
          />
        </div>

        <div class="flex justify-center">
          <button
            type="submit"
            class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-semibold px-6 py-3 rounded-lg shadow-md transition"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
