{% extends 'adminmain.html' %} {% block bodycontent %}
<div class="sub-title">
  <h3>Alumni</h3>
  <p class="hometext">Home</p>
  <p class="certxt">&gt; Admin Events</p>
</div>
<section class="min-h-screen py-16">
  <div class="max-w-5xl mx-auto px-6">
    <div class="bg-white rounded-2xl shadow-xl p-10">
      <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        Admin Events
      </h1>

      {% if messages %} {% for message in messages %}
      <div
        class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 rounded-lg mb-6 text-center font-semibold"
      >
        {{ message }}
      </div>
      {% endfor %} {% endif %}

      <form
        method="post"
        action="{% url 'admin_events' %}"
        enctype="multipart/form-data"
        class="space-y-6"
      >
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Name</label
            >
            <input
              type="text"
              name="eventsName"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Date</label
            >
            <input
              type="date"
              name="eventsDate"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Event Location</label
            >
            <input
              type="text"
              name="eventsLocation"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Event Description</label
          >
          <textarea
            name="eventsDescription"
            required
            class="w-full h-40 px-4 py-3 border border-gray-300 rounded-lg shadow-sm resize-none focus:outline-none focus:ring-2 focus:ring-orange-400"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Upload Image</label
          >
          <input
            type="file"
            name="eventsImage"
            required
            class="file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100"
          />
        </div>

        <div class="flex justify-center">
          <button
            type="submit"
            class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-semibold px-6 py-3 rounded-lg shadow-md transition"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
