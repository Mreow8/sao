{% block bodycontent %}
<style>
  .container {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 1.8rem;
    color: #333;
  }

  form p {
    margin-bottom: 18px;
  }

  form label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #444;
  }

  form input[type="text"],
  form input[type="email"],
  form input[type="number"],
  form input[type="date"],
  form select,
  form textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.3s ease, box-shadow 0.3s ease;
  }

  form input:focus,
  form select:focus,
  form textarea:focus {
    border-color: #ff8000;
    box-shadow: 0 0 6px rgba(0, 123, 255, 0.4);
    outline: none;
  }

  button.btn-primary {
    display: block;
    width: 100%;
    padding: 12px;
    background: #ff8000;
    color: white;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button.btn-primary:hover {
    background: #ff8000;
  }

  /* ✅ Responsive for small screens */
  @media (max-width: 768px) {
    .container {
      margin: 20px;
      padding: 20px;
    }

    h2 {
      font-size: 1.5rem;
    }

    button.btn-primary {
      font-size: 14px;
      padding: 10px;
    }
  }

  @media (max-width: 480px) {
    .container {
      margin: 10px;
      padding: 15px;
    }

    h2 {
      font-size: 1.3rem;
    }

    form label {
      font-size: 14px;
    }

    form input,
    form select,
    form textarea {
      font-size: 13px;
      padding: 8px 10px;
    }

    button.btn-primary {
      font-size: 13px;
      padding: 8px;
    }
  } /* Modal overlay */
  #editModal {
    display: none; /* hidden by default */
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    overflow-y: auto; /* scroll if content too tall */
    padding: 20px; /* spacing from viewport edges */
    z-index: 1000;
  }

  /* Modal box */
  #editModal .modal-box {
    max-height: 80vh; /* limit height */
    overflow-y: auto; /* scroll content if needed */
    border-radius: 12px;
    background: #fff;
    padding: 20px;
    width: 600px;
    max-width: 95%;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
  }
  @media (max-width: 480px) {
    #editModal .modal-box {
      width: 95%;
      max-height: 90vh;
    }
  }
</style>
<div class="container">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %} {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
