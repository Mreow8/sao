
<style>/* The main container for the pagination */
.pagination-pill {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px; /* Adjust spacing between buttons */
  margin-top: 32px; /* Add some space above/below the pagination */
}

/* Base style for clickable arrows and page numbers */
.pagination-pill .arrow,
.pagination-pill .page-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%; /* This makes them circular */
  font-size: 14px;
  font-weight: 500;
  color: #333;
  background-color: #fff;
  border: 1px solid #ddd;
  text-decoration: none;
  transition: background-color 0.2s, color 0.2s;
  cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Hover effect for clickable items */
.pagination-pill .arrow:not(.disabled):hover,
.pagination-pill .page-number:not(.active):hover {
  background-color: #f0f5ff; /* A light blue hover */
  color: #0056b3;
  border-color: #c0d8f7;
}

/* Style for the ACTIVE (current) page */
.pagination-pill .page-number.active {
  background-color: #2c5282; /* Primary blue background */
  color: #ffffff; /* White text */
  font-weight: 700;
  border-color: #007bff;
  cursor: default;
}

/* Style for DISABLED arrows (no prev/next) */
.pagination-pill .arrow.disabled {
  background-color: #f4f4f4; /* Light grey background */
  color: #aaa; /* Light grey text */
  cursor: not-allowed;
  border-color: #eee;
}

/* Style for the ellipsis "..." */
.pagination-pill .ellipsis {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  font-size: 14px;
  font-weight: 500;
  color: #aaa;
}</style><nav class="pagination-pill">
  {% if page_obj.has_previous %}
  <a
    href="?page={{ page_obj.previous_page_number }}{{ search_params }}&sort={{ current_sort }}&order={{ current_order }}"
    class="arrow prev"
    aria-label="Previous Page"
    >&lt;</a
  >
  {% else %}
  <span class="arrow disabled">&lt;</span>
  {% endif %} {% for i in page_obj.paginator.get_elided_page_range %}
  
  {% if i == page_obj.paginator.ELLIPSIS %}
  <span class="page-number ellipsis">...</span>
  {% elif i == page_obj.number %}
  <a href="#" class="page-number active">{{ i }}</a>
  {% else %}
  <a
    href="?page={{ i }}{{ search_params }}&sort={{ current_sort }}&order={{ current_order }}"
    class="page-number"
    >{{ i }}</a
  >
  {% endif %} {% endfor %} {% if page_obj.has_next %}
  <a
    href="?page={{ page_obj.next_page_number }}{{ search_params }}&sort={{ current_sort }}&order={{ current_order }}"
    class="arrow next"
    aria-label="Next Page"
    >&gt;</a
  >
  {% else %}
  <span class="arrow disabled">&gt;</span>
  {% endif %}
</nav>
